# XcodeGen source-of-truth for the whole Xcode project.
name: Speedometer
options:
  # Keep generation tied to features available in this XcodeGen version.
  minimumXcodeGenVersion: 2.45.0
settings:
  base:
    # Global project defaults inherited by targets unless overridden.
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    # Xcode "recommended settings":
    # Sandbox user build phase scripts for build correctness.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Generate Swift symbols for entries in String Catalogs.
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Single development team inherited by all targets.
    DEVELOPMENT_TEAM: A9XG98CQJG
targets:
  # Main iOS app target.
  Speedometer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Speedometer
        excludes:
          - Info.plist
    info:
      # We maintain plist manually instead of auto-generating one.
      path: Speedometer/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: "Speedometer uses your location while the app is open to measure your speed."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronbbrown.speedometer
        PRODUCT_NAME: Speedometer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Speedometer/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Code signing: automatic management.
        # DEVELOPMENT_TEAM is inherited from project-level settings; override there if you fork.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    scheme:
      testTargets:
        - SpeedometerTests

  # Unit test bundle target.
  SpeedometerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SpeedometerTests
    dependencies:
      - target: Speedometer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronbbrown.speedometerTests
        PRODUCT_NAME: SpeedometerTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
